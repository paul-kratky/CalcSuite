# OpenSSF Scorecard: an automated security check of this repository (pinned actions, branch
# protection, signed releases, dangerous workflow patterns, ...). The results go to the
# repository's Security tab (code scanning) and to the public Scorecard API, which the README's
# badge shows: https://scorecard.dev/viewer/?uri=github.com/paul-kratky/CalcSuite
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'  # Mondays
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # The results in the Security tab
      id-token: write         # Publishing the results (the badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: results.sarif
