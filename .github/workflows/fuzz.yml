# Coverage-guided fuzzing (atheris, libFuzzer) of everything CalcSuite reads from outside: TI
# files, TI-Basic text, the link helpers' listings, TI's OS page. tools/fuzz/fuzz_calc_files.py.
# A short run on pushes and pull requests, a long one every week.
name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'  # atheris 3.1.0 has wheels for 3.12+

      - name: Install atheris (pinned by hash)
        run: python -m pip install --require-hashes -r tools/fuzz/requirements.txt

      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        run: |
          mkdir -p corpus
          python tools/fuzz/fuzz_calc_files.py --seeds corpus
          python tools/fuzz/fuzz_calc_files.py -max_total_time="$SECONDS_TO_RUN" -timeout=10 -rss_limit_mb=2048 corpus
