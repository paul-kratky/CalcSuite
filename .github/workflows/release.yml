# Builds the release download on a clean Windows runner: ONE zip people download and unzip.
#   CalcSuite-<version>-win64.zip   the CalcSuite folder: CalcSuite.exe and _internal\ (the app and
#                                   its link tools), Guides\ (the PDFs), Licences\, an empty
#                                   "CalcSuite files" (everything the app saves goes there) and
#                                   "Read me first.txt" (tools/release_files.py package)
#   SHA256SUMS.txt                  its SHA-256
# A folder, not one self-unpacking exe, and PyInstaller's launcher built from source here, both
# so antivirus heuristics don't flag the app (the prebuilt launcher and unpacking into %TEMP%
# are what they key on). Same steps as a local build: MSYS2 UCRT64 gcc + the pinned libusb
# release, tools/build_tools.py --force --luna (luna.exe only as the self-test's reference for
# tools/tns_writer.py: it isn't shipped), the self-test and PyInstaller 6.22.3 on Python 3.11.
#
# Every run uploads the files as a workflow artifact. A pushed tag v* also makes a DRAFT
# GitHub release with them, its notes the CHANGELOG.md section of that version; the owner
# reviews and publishes it. Pushes to the ci-release branch build only (for testing this file).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [ci-release]

permissions:
  contents: read

env:
  LIBUSB_VERSION: '1.0.30'
  LIBUSB_SHA256: 7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79
  # libusb's own licence text (COPYING at the release tag), shipped in the tools zip
  LIBUSB_COPYING_SHA256: 5df07007198989c622f5d41de8d703e7bef3d0e79d62e24332ee739a452af62a
  PYINSTALLER_VERSION: '6.22.3'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # The attestation's signing certificate (Sigstore, GitHub's OIDC token)
      attestations: write  # Stores the attestation with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'  # tivars needs 3.11+; the local builds use 3.11 too

      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: false
          # gcc brings g++, binutils (windres) and winpthreads; zlib for luna.exe (the test reference)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Point the build at the MSYS2 toolchain
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          & (Join-Path $bin 'gcc.exe') --version | Select-Object -First 1
          "CALCSUITE_MINGW=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch libusb (pinned release, SHA-256 checked; third_party/README.md)
        shell: pwsh
        run: |
          $v = $env:LIBUSB_VERSION
          New-Item -ItemType Directory -Force build | Out-Null
          $arc = "build/libusb-$v.7z"
          Invoke-WebRequest "https://github.com/libusb/libusb/releases/download/v$v/libusb-$v.7z" -OutFile $arc
          $got = (Get-FileHash $arc -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LIBUSB_SHA256) { throw "libusb-$v.7z has SHA-256 $got, expected $env:LIBUSB_SHA256" }
          7z x $arc "-othird_party/libusb-$v" -y | Out-Null
          if ($LASTEXITCODE) { throw "7z failed" }
          Invoke-WebRequest "https://raw.githubusercontent.com/libusb/libusb/v$v/COPYING" -OutFile build/libusb_COPYING.txt
          $got = (Get-FileHash build/libusb_COPYING.txt -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LIBUSB_COPYING_SHA256) { throw "libusb COPYING has SHA-256 $got" }

      - name: Build the link tools (and luna.exe, the self-test's reference)
        run: python -I tools/build_tools.py --force --luna

      - name: Self-test (the .tns writer compared with luna.exe byte for byte)
        run: python -I tools/selftest/run_selftest.py

      # Before PyInstaller: the exe bundles docs/pdf/ for Save as PDF. Edge is on the runner image;
      # make_pdfs.py finds it (Program Files (x86) or Program Files, else msedge on PATH)
      - name: Guides and Functions references as PDFs (headless Edge)
        shell: pwsh
        run: |
          $ver = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = @('--version', $env:GITHUB_REF_NAME) }
          python -I tools/docs_build/make_pdfs.py @ver
          if ($LASTEXITCODE) { throw "make_pdfs.py failed" }

      - name: Build the CalcSuite folder (PyInstaller, its launcher compiled here)
        shell: pwsh
        env:
          # Build the bootloader from source with this runner's MSVC: a launcher no one else
          # ships, instead of the prebuilt one antivirus heuristics have learnt
          PYINSTALLER_COMPILE_BOOTLOADER: '1'
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '0.0.0' }
          python -I tools/release_files.py version-info $ver
          python -m venv build/venv
          build/venv/Scripts/python -m pip install --disable-pip-version-check --no-binary pyinstaller "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE) { throw "pip (PyInstaller from source) failed" }
          build/venv/Scripts/python -m PyInstaller --noconfirm --distpath dist --workpath build/pyi app.spec
          if ($LASTEXITCODE) { throw "PyInstaller failed" }

      - name: The zip and SHA256SUMS.txt
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '0.0.0' }
          python -I tools/release_files.py package $ver --libusb $env:LIBUSB_VERSION
          if ($LASTEXITCODE) { throw "release_files.py package failed" }

      # Build provenance: a signed statement that this exact zip was built by this workflow from
      # this commit. Anyone can check a download:
      #   gh attestation verify CalcSuite-<version>-win64.zip -R paul-kratky/CalcSuite
      - name: Attest the zip (where and how it was built)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: out/CalcSuite-*-win64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: CalcSuite-${{ github.ref_name }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: CalcSuite-${{ github.ref_name }}
          path: out

      - name: Release notes from CHANGELOG.md
        shell: python
        run: |
          import os, re, sys
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(ver), text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit("CHANGELOG.md has no section '## [%s]'" % ver)
          repo = os.environ["GITHUB_REPOSITORY"]
          notes = m.group(1).strip() + "\n"
          notes += ("\n### Check your download\n\n"
                    "- SHA-256: compare with `SHA256SUMS.txt` (PowerShell: "
                    "`Get-FileHash CalcSuite-%s-win64.zip`).\n"
                    "- Built by GitHub from this repository's code, not on anyone's PC: with the "
                    "GitHub CLI, `gh attestation verify CalcSuite-%s-win64.zip -R %s` "
                    "([build provenance](https://github.com/%s/attestations)).\n"
                    % (ver, ver, repo, repo))
          open("out/notes.md", "w", encoding="utf-8").write(notes)

      # VirusTotal: the zip scanned by ~70 antivirus engines, the result and its public page
      # added to the release notes. Runs only when the repository has a VT_API_KEY secret (a free
      # VirusTotal account's API key); without it this step says so and the release goes on.
      - name: VirusTotal scan (when the VT_API_KEY secret is set)
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) { "No VT_API_KEY secret: skipped"; exit 0 }
          $zip = (Get-ChildItem out/CalcSuite-*-win64.zip).FullName
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $h = @{ 'x-apikey' = $env:VT_API_KEY }
          $up = curl.exe -s --fail -X POST https://www.virustotal.com/api/v3/files -H "x-apikey: $env:VT_API_KEY" --form "file=@$zip" | ConvertFrom-Json
          if (-not $up.data.id) { "Upload failed: skipped"; exit 0 }
          $stats = $null
          foreach ($i in 1..40) {
            Start-Sleep 15
            $a = Invoke-RestMethod "https://www.virustotal.com/api/v3/analyses/$($up.data.id)" -Headers $h
            if ($a.data.attributes.status -eq 'completed') { $stats = $a.data.attributes.stats; break }
          }
          $link = "https://www.virustotal.com/gui/file/$sha"
          if ($stats) {
            $engines = $stats.malicious + $stats.suspicious + $stats.undetected + $stats.harmless
            $flagged = $stats.malicious + $stats.suspicious
            $line = "- VirusTotal: $flagged of $engines antivirus engines flag it ([the scan]($link))."
          } else {
            $line = "- VirusTotal: [the scan]($link) (still running when this release was made)."
          }
          $line
          Add-Content -Path out/notes.md -Value $line -Encoding utf8

      - name: Draft release (the owner reviews and publishes it)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem out/CalcSuite-*-win64.zip).FullName
          if (-not $zip) { throw "No zip in the build artifact" }
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title $env:GITHUB_REF_NAME `
            --notes-file out/notes.md $zip out/SHA256SUMS.txt
          if ($LASTEXITCODE) { throw "gh release create failed" }
