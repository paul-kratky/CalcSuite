# Builds the release downloads on a clean Windows runner:
#   CalcSuite.exe               the app (PyInstaller, app.spec)
#   CalcSuite-tools-win64.zip   the link tools for running from source (unzip into tools/bin/)
#   CalcSuite-*.pdf             the guides and Functions references as PDFs (docs/pdf/)
#   SHA256SUMS.txt              SHA-256 of all of them
# Same steps as a local build: MSYS2 UCRT64 gcc + the pinned libusb release, then
# tools/build_tools.py --force, the self-test (with luna.exe, so the .tns tests run too) and
# PyInstaller 6.22.3 on Python 3.11.
#
# Every run uploads the files as a workflow artifact. A pushed tag v* also makes a DRAFT
# GitHub release with them, its notes the CHANGELOG.md section of that version; the owner
# reviews and publishes it. Pushes to the ci-release branch build only (for testing this file).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [ci-release]

permissions:
  contents: read

env:
  LIBUSB_VERSION: '1.0.30'
  LIBUSB_SHA256: 7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79
  # libusb's own licence text (COPYING at the release tag), shipped in the tools zip
  LIBUSB_COPYING_SHA256: 5df07007198989c622f5d41de8d703e7bef3d0e79d62e24332ee739a452af62a
  PYINSTALLER_VERSION: '6.22.3'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'  # tivars needs 3.11+; the local builds use 3.11 too

      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: false
          # gcc brings g++, binutils (windres) and winpthreads; zlib for luna.exe (-static -lz)
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zlib

      - name: Point the build at the MSYS2 toolchain
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          & (Join-Path $bin 'gcc.exe') --version | Select-Object -First 1
          "CALCSUITE_MINGW=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch libusb (pinned release, SHA-256 checked; third_party/README.md)
        shell: pwsh
        run: |
          $v = $env:LIBUSB_VERSION
          New-Item -ItemType Directory -Force build | Out-Null
          $arc = "build/libusb-$v.7z"
          Invoke-WebRequest "https://github.com/libusb/libusb/releases/download/v$v/libusb-$v.7z" -OutFile $arc
          $got = (Get-FileHash $arc -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LIBUSB_SHA256) { throw "libusb-$v.7z has SHA-256 $got, expected $env:LIBUSB_SHA256" }
          7z x $arc "-othird_party/libusb-$v" -y | Out-Null
          if ($LASTEXITCODE) { throw "7z failed" }
          Invoke-WebRequest "https://raw.githubusercontent.com/libusb/libusb/v$v/COPYING" -OutFile build/libusb_COPYING.txt
          $got = (Get-FileHash build/libusb_COPYING.txt -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LIBUSB_COPYING_SHA256) { throw "libusb COPYING has SHA-256 $got" }

      - name: Build the link tools
        run: python -I tools/build_tools.py --force

      - name: Self-test (with luna.exe, so the .tns tests run)
        run: python -I tools/selftest/run_selftest.py

      # Before PyInstaller: the exe bundles docs/pdf/ for Save as PDF. Edge is on the runner image;
      # make_pdfs.py finds it (Program Files (x86) or Program Files, else msedge on PATH)
      - name: Guides and Functions references as PDFs (headless Edge)
        shell: pwsh
        run: |
          $ver = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $ver = @('--version', $env:GITHUB_REF_NAME) }
          python -I tools/docs_build/make_pdfs.py @ver
          if ($LASTEXITCODE) { throw "make_pdfs.py failed" }

      - name: Build CalcSuite.exe (PyInstaller in a venv)
        shell: pwsh
        run: |
          python -m venv build/venv
          build/venv/Scripts/python -m pip install --disable-pip-version-check "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE) { throw "pip failed" }
          build/venv/Scripts/python -m PyInstaller --noconfirm --distpath dist --workpath build/pyi app.spec
          if ($LASTEXITCODE) { throw "PyInstaller failed" }

      - name: Tools zip and SHA256SUMS.txt
        shell: python
        run: |
          import hashlib, os, zipfile
          os.makedirs("out", exist_ok=True)
          v = os.environ["LIBUSB_VERSION"]
          readme = (
              "Unzip into CalcSuite's tools/bin/ folder (to run CalcSuite or its scripts from"
              " the source; CalcSuite.exe already has these inside).\n\n"
              "nspire-cli.exe: GPL-3.0-or-later (links libnspire). Source: tools/nspire_cli/ in"
              " https://github.com/paul-kratky/CalcSuite and libnspire commit 7d7d962"
              " (https://github.com/Vogtinator/libnspire). licences/nspire-cli_GPL-3.0.txt\n"
              "ti84-cli.exe, ti89-cli.exe (the same program): GPL-3.0-or-later. Source:"
              " tools/ti84_cli/ in https://github.com/paul-kratky/CalcSuite."
              " licences/nspire-cli_GPL-3.0.txt\n"
              "calcsuite-driver.exe: LGPL-3.0-or-later (links libwdi statically,"
              " https://github.com/pbatard/libwdi commit 30df0c0). Source: tools/driver_helper/"
              " in https://github.com/paul-kratky/CalcSuite. licences/calcsuite-driver_LGPL-3.0.txt"
              " (with the GPL-3.0 text it builds on, licences/nspire-cli_GPL-3.0.txt). It"
              " contains Microsoft's WinUSB co-installers (WdfCoInstaller01011.dll,"
              " winusbcoinstaller2.dll) from the WDK 8 redistributable components, which"
              " Microsoft lets driver packages ship.\n"
              "luna.exe: MPL-1.1, source https://github.com/ndless-nspire/Luna commit a9924a9"
              " (includes MiniZip and zlib, zlib licence, and Eric Young's DES code)."
              " licences/luna_MPL-1.1.txt\n"
              "libusb-1.0.dll: LGPL-2.1-or-later, the official libusb %s release"
              " (https://github.com/libusb/libusb/releases/tag/v%s)."
              " licences/libusb_LGPL-2.1.txt\n" % (v, v))
          files = [(f, "tools/bin/" + f) for f in ["luna.exe", "nspire-cli.exe", "ti84-cli.exe",
                   "ti89-cli.exe", "calcsuite-driver.exe", "libusb-1.0.dll"]]
          files += [("licences/nspire-cli_GPL-3.0.txt", "tools/nspire_cli/COPYING"),
                    ("licences/calcsuite-driver_LGPL-3.0.txt", "third_party/libwdi/COPYING-LGPL"),
                    ("licences/luna_MPL-1.1.txt", "third_party/luna/LICENSE"),
                    ("licences/libusb_LGPL-2.1.txt", "build/libusb_COPYING.txt"),
                    ("licences/libusb_README.txt", "third_party/libusb-%s/README.txt" % v)]
          with zipfile.ZipFile("out/CalcSuite-tools-win64.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for name, src in files:
                  z.write(src, name)
              z.writestr("README.txt", readme.replace("\n", "\r\n"))
          os.replace("dist/CalcSuite.exe", "out/CalcSuite.exe")
          # The PDFs without spaces in their names (GitHub turns spaces in asset names into dots)
          import glob, shutil
          pdfs = []
          for src in sorted(glob.glob("docs/pdf/*.pdf")):
              name = os.path.basename(src).replace(" - ", "-").replace(" ", "-")
              shutil.copyfile(src, os.path.join("out", name))
              pdfs.append(name)
          if not pdfs:
              raise SystemExit("No PDFs in docs/pdf")
          lines = []
          for name in ["CalcSuite.exe", "CalcSuite-tools-win64.zip"] + pdfs:
              data = open(os.path.join("out", name), "rb").read()
              lines.append("%s  %s\n" % (hashlib.sha256(data).hexdigest(), name))
              print("%-56s %10d bytes" % (name, len(data)))
          open("out/SHA256SUMS.txt", "w", newline="\n").write("".join(lines))
          print("".join(lines))

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: CalcSuite-${{ github.ref_name }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: CalcSuite-${{ github.ref_name }}
          path: out

      - name: Release notes from CHANGELOG.md
        shell: python
        run: |
          import os, re, sys
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(ver), text, re.M | re.S)
          if not m or not m.group(1).strip():
              sys.exit("CHANGELOG.md has no section '## [%s]'" % ver)
          open("out/notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")

      - name: Draft release (the owner reviews and publishes it)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pdfs = (Get-ChildItem out/*.pdf).FullName
          if (-not $pdfs) { throw "No PDFs in the build artifact" }
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title $env:GITHUB_REF_NAME `
            --notes-file out/notes.md out/CalcSuite.exe out/CalcSuite-tools-win64.zip out/SHA256SUMS.txt @pdfs
          if ($LASTEXITCODE) { throw "gh release create failed" }
